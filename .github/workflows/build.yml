name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
    tags-ignore:
      - "*" # Ignore all tags
    paths:
      - '**.java'
      - '**/pom.xml'
      - 'core/src/test/resources/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**.java'
      - '**/pom.xml'
      - 'core/src/test/resources/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    # ubuntu-22.04 (kernel 6.8): the mongo:8.0 container of the integration tests refuses to start
    # on the kernel of the newer images (reported as 7.0.0, see SERVER-121912 / SERVER-136848).
    # Move back to ubuntu-latest once MongoDB 8.0.35+ is on Docker Hub.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build and run unit and integration tests with Maven
      run: mvn -B verify